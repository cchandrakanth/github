# App Foundation — Database Schema
# Full v1 SQLite schema created by the foundation migrations. Feature specs
# (notes-crud, folders-tags, search, note-reminders) consume these tables and
# reference this file rather than redefining them.

feature: "app-foundation"
spec_ref: "specs/app-foundation/spec.md"

database: "SQLite (expo-sqlite) via Drizzle ORM; migrations generated by drizzle-kit and applied on app start inside a transaction"

collections:
  - path: "notes"
    description: "All user notes (rich text). Soft-deleted rows stay until emptied from Trash."
    document:
      fields:
        - name: "id"
          type: "text (uuid)"
          required: true
          description: "Primary key, generated client-side"
        - name: "title"
          type: "text"
          required: true
          description: "Note title; may be empty string, never NULL"
        - name: "body_html"
          type: "text"
          required: true
          description: "Sanitized rich-text HTML from the editor"
        - name: "body_text"
          type: "text"
          required: true
          description: "Plain-text projection of body_html, kept in sync on every save; feeds FTS"
        - name: "folder_id"
          type: "text (fk → folders.id)"
          required: false
          description: "NULL = unfiled; ON DELETE SET NULL"
        - name: "pinned"
          type: "integer (0/1)"
          required: true
          description: "Pinned notes sort first in lists; default 0"
        - name: "created_at"
          type: "integer (unix ms)"
          required: true
          description: "Creation timestamp"
        - name: "updated_at"
          type: "integer (unix ms)"
          required: true
          description: "Last content update"
        - name: "deleted_at"
          type: "integer (unix ms)"
          required: false
          description: "NULL = live; set = in Trash (soft delete)"
    indexes:
      - fields: ["folder_id", "deleted_at", "pinned", "updated_at"]
        order: [asc, asc, desc, desc]
        purpose: "Folder-filtered note lists sorted pinned-first, newest-first"
      - fields: ["deleted_at", "updated_at"]
        order: [asc, desc]
        purpose: "All-notes list and Trash view"
    access_rules: |
      Single local user; no row-level access control. All access via src/db/repositories/notesRepo.ts.

  - path: "folders"
    description: "User-created folders for organizing notes (flat list, no nesting in v1)"
    document:
      fields:
        - name: "id"
          type: "text (uuid)"
          required: true
          description: "Primary key"
        - name: "name"
          type: "text"
          required: true
          description: "Unique (case-insensitive), non-empty, trimmed"
        - name: "position"
          type: "integer"
          required: true
          description: "Manual sort order in the folder list"
        - name: "created_at"
          type: "integer (unix ms)"
          required: true
          description: "Creation timestamp"
        - name: "updated_at"
          type: "integer (unix ms)"
          required: true
          description: "Last update timestamp"
    indexes:
      - fields: ["name"]
        order: [asc]
        purpose: "UNIQUE COLLATE NOCASE — enforce unique folder names"
    access_rules: |
      All access via src/db/repositories/foldersRepo.ts.

  - path: "tags"
    description: "User-created tags; assigned to notes via note_tags"
    document:
      fields:
        - name: "id"
          type: "text (uuid)"
          required: true
          description: "Primary key"
        - name: "name"
          type: "text"
          required: true
          description: "Unique (case-insensitive), non-empty, trimmed, no leading '#'"
        - name: "color"
          type: "text"
          required: false
          description: "Token name from the design palette (not raw hex)"
        - name: "created_at"
          type: "integer (unix ms)"
          required: true
          description: "Creation timestamp"
    indexes:
      - fields: ["name"]
        order: [asc]
        purpose: "UNIQUE COLLATE NOCASE — enforce unique tag names"
    access_rules: |
      All access via src/db/repositories/tagsRepo.ts.

  - path: "note_tags"
    description: "Many-to-many join between notes and tags"
    document:
      fields:
        - name: "note_id"
          type: "text (fk → notes.id, ON DELETE CASCADE)"
          required: true
          description: "Composite PK part 1"
        - name: "tag_id"
          type: "text (fk → tags.id, ON DELETE CASCADE)"
          required: true
          description: "Composite PK part 2"
    indexes:
      - fields: ["tag_id", "note_id"]
        order: [asc, asc]
        purpose: "Reverse lookup: all notes for a tag"
    access_rules: |
      Managed only through tagsRepo/notesRepo helpers.

  - path: "reminders"
    description: "Reminders attached to notes; each row owns at most one scheduled local notification"
    document:
      fields:
        - name: "id"
          type: "text (uuid)"
          required: true
          description: "Primary key"
        - name: "note_id"
          type: "text (fk → notes.id, ON DELETE CASCADE)"
          required: true
          description: "Owning note"
        - name: "kind"
          type: "text enum: once | daily | weekly"
          required: true
          description: "Recurrence type"
        - name: "at_datetime"
          type: "integer (unix ms)"
          required: false
          description: "Fire time for kind=once; NULL otherwise"
        - name: "time_of_day"
          type: "text 'HH:mm' (24h, device-local)"
          required: false
          description: "Fire time for kind=daily|weekly; NULL for once"
        - name: "weekday"
          type: "integer 1-7 (1=Monday)"
          required: false
          description: "Required when kind=weekly; NULL otherwise"
        - name: "enabled"
          type: "integer (0/1)"
          required: true
          description: "Paused reminders keep their config but schedule no notification; default 1"
        - name: "notification_id"
          type: "text"
          required: false
          description: "expo-notifications scheduled-notification identifier; NULL when disabled/fired(once)"
        - name: "created_at"
          type: "integer (unix ms)"
          required: true
          description: "Creation timestamp"
        - name: "updated_at"
          type: "integer (unix ms)"
          required: true
          description: "Last update timestamp"
    indexes:
      - fields: ["note_id"]
        order: [asc]
        purpose: "Load reminders for a note"
      - fields: ["enabled", "kind"]
        order: [asc, asc]
        purpose: "Reminders overview screen and re-scheduling sweeps"
    access_rules: |
      All access via src/db/repositories/remindersRepo.ts; notification scheduling side-effects live in src/lib/notifications.ts.

  - path: "notes_fts"
    description: "FTS5 virtual table over notes(title, body_text) — contentless-delete or external-content mode keyed by notes.id; kept in sync by SQL triggers on notes INSERT/UPDATE/DELETE"
    document:
      fields:
        - name: "title"
          type: "text (indexed)"
          required: true
          description: "Mirrors notes.title"
        - name: "body_text"
          type: "text (indexed)"
          required: true
          description: "Mirrors notes.body_text"
    indexes: []
    access_rules: |
      Query only via src/db/repositories/searchRepo.ts using parameterized MATCH queries.

api_routes: []   # local-only app — repositories replace API routes
