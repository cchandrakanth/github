# Folders & Tags — Test Cases
# Maps 1:1 to acceptance criteria in spec.md

feature: "folders-tags"
spec_ref: "specs/folders-tags/spec.md"

unit_tests:
  - id: UT-1
    ac_ref: "AC-1.1"
    description: "createFolder trims, rejects empty, rejects case-insensitive duplicates"
    file: "__tests__/unit/foldersRepo.test.ts"
    steps:
      - action: "createFolder('  Work  ')"
        expected: "Folder named 'Work'"
      - action: "createFolder('work')"
        expected: "DuplicateNameError"
      - action: "createFolder('   ')"
        expected: "ValidationError"
  - id: UT-2
    ac_ref: "AC-1.2"
    description: "reorderFolders persists new positions"
    file: "__tests__/unit/foldersRepo.test.ts"
    steps:
      - action: "Create A,B,C; reorder to C,A,B; listFoldersWithCounts"
        expected: "Order C,A,B"
  - id: UT-3
    ac_ref: "AC-1.3"
    description: "deleteFolder moves notes to Unfiled instead of deleting them"
    file: "__tests__/unit/foldersRepo.test.ts"
    steps:
      - action: "Folder with 2 notes; deleteFolder"
        expected: "Both notes exist with folder_id NULL"
  - id: UT-4
    ac_ref: "AC-1.4, EC-3"
    description: "listFoldersWithCounts excludes trashed notes from counts"
    file: "__tests__/unit/foldersRepo.test.ts"
    steps:
      - action: "Folder with 3 notes, soft-delete 1; listFoldersWithCounts"
        expected: "Count = 2"
  - id: UT-5
    ac_ref: "AC-3.1, EC-2"
    description: "findOrCreateTag reuses case-insensitive match and strips '#'"
    file: "__tests__/unit/tagsRepo.test.ts"
    steps:
      - action: "findOrCreateTag('Urgent'); findOrCreateTag('#urgent')"
        expected: "Same tag id both times; stored name 'Urgent'"
  - id: UT-6
    ac_ref: "AC-3.4, AC-3.5"
    description: "setNoteTags replaces links atomically; listNotesByTag composes with folder filter"
    file: "__tests__/unit/tagsRepo.test.ts"
    steps:
      - action: "Note in folder Work tagged urgent; listNotesByTag(urgent, {folderId: Work})"
        expected: "Note returned"
      - action: "setNoteTags(note, []) then listNotesByTag(urgent)"
        expected: "Empty"

integration_tests:
  - id: IT-1
    ac_ref: "AC-2.1, AC-2.3"
    description: "Editor folder selector moves note and updates counts"
    file: "__tests__/component/folder-selector.test.tsx"
    setup:
      - "Seed folders Work/Home and one Unfiled note"
    steps:
      - action: "Open note, pick Work in folder selector"
        expected: "notesRepo.updateNote called with folder_id=Work; Work count increments in UI"
  - id: IT-2
    ac_ref: "AC-2.2, EC-1"
    description: "Folder chip filters list; deleting the active folder resets to All"
    file: "__tests__/component/folder-filter.test.tsx"
    steps:
      - action: "Tap Work chip"
        expected: "Only Work notes visible, pinned-first"
      - action: "Delete Work folder"
        expected: "Filter shows All; no crash"
  - id: IT-3
    ac_ref: "AC-3.1, AC-3.2, AC-3.3"
    description: "Tag picker attaches tag; chip renders on card and filters on tap"
    file: "__tests__/component/tag-picker.test.tsx"
    steps:
      - action: "In editor, create tag 'shopping' inline"
        expected: "Chip '#shopping' in editor and on note card"
      - action: "Tap chip on card"
        expected: "List filtered to tagged notes with filter bar visible"

e2e_tests:
  - id: E2E-1
    ac_ref: "US-1, US-2"
    description: "Create folder, file note, filter, delete folder → note becomes Unfiled"
    file: "__tests__/e2e/folders-tags.yml"
    preconditions:
      - "One existing note"
    steps:
      - action: "Create folder 'Work'; assign note; tap Work chip"
        expected: "Note visible under Work with count 1"
      - action: "Delete folder 'Work' (confirm)"
        expected: "Note under Unfiled; app on All filter"
  - id: E2E-2
    ac_ref: "US-3"
    description: "Tag a note and filter by the tag"
    file: "__tests__/e2e/folders-tags.yml"
    steps:
      - action: "Open note, add tag 'urgent', go back, tap '#urgent' chip"
        expected: "Filtered list shows the note"

role_tests:
  enabled: false   # v1 has no authentication or roles (auth.provider = None)
